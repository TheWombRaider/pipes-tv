plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.thewombraider.pipestv'
    compileSdk 34

    defaultConfig {
        applicationId 'io.github.thewombraider.pipestv'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Sideloaded over ADB only: signed with the debug key.
            signingConfig signingConfigs.debug
        }
    }

    lint {
        // Deliberate: this is a sideloaded app that stays on API 34 until it is retested on a newer image.
        disable 'OldTargetApi'
        // The icon is a square crop of a real frame, which is what it should be.
        disable 'IconLauncherShape'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}

def teapotInputs = rootProject.file('tools/teapot')
def verifyTeapot = tasks.register('verifyTeapot') {
    inputs.dir(teapotInputs)
    inputs.file('src/main/assets/teapot.bin')
    doLast {
        def manifest = new groovy.json.JsonSlurper().parse(new File(teapotInputs, 'manifest.json'))
        [
            (new File(teapotInputs, 'glut_teapot.c')): manifest.source_sha256,
            (new File(teapotInputs, 'control-points.json')): manifest.data_sha256,
            (file('src/main/assets/teapot.bin')): manifest.asset_sha256
        ].each { input, expected ->
            def actual = java.security.MessageDigest.getInstance('SHA-256').digest(input.bytes).encodeHex().toString()
            if (actual != expected) throw new GradleException("Teapot hash mismatch: ${input}. Run tools/test_teapot.py before updating the manifest.")
        }
    }
}
tasks.named('preBuild').configure { dependsOn verifyTeapot }
